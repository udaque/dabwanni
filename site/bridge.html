<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다봤니 · 연결</title>
<style>body{margin:0;padding:24px;font:16px/1.6 -apple-system,sans-serif;background:#10151E;color:#E7ECF3}@media (prefers-color-scheme:light){body{background:#F4F6F9;color:#18202E}}b{display:block;font-size:18px;margin-bottom:8px}</style></head>
<body><b>다봤니 · 연결</b><p id="m">다른 사이트에서 다봤니 북마크를 누르면 여기로 연결됩니다.</p>
<script>
// 바깥 js를 막는 사이트에서 다봤니 북마크를 누르면 이 창이 열리고, 그 사이트에 맞는 코드를 보내 줌
var CODE = { 'https://ridibooks.com': '/ridi_bm.min.js', 'https://library.ridibooks.com': '/ridi_bm.min.js' };
addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'dw-hello' || !/^https:\/\//.test(e.origin)) return;
  // 코드를 넘긴 뒤 이 창은 스스로 닫음: 나중에 「다봤니로 보내기」가 이 창을 다시 쓰지 않고 다봤니를 새 탭으로 앞에 띄우게
  var src = CODE[e.origin], done = function (code) { e.source.postMessage({ type: 'dw-code', code: code }, e.origin); document.getElementById('m').textContent = code ? '연결됐습니다. 원래 화면으로 돌아가 「시작」을 눌러 주세요.' : '이 사이트는 아직 지원하지 않습니다.'; if (code) setTimeout(function () { window.close(); }, 600); };
  if (!src) return done('');
  fetch(src + '?v=' + Date.now()).then(function (r) { return r.text(); }).then(done, function () { done(''); });
});
</script></body></html>
