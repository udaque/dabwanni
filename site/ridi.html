<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다봤니 · 리디 연결</title>
<style>body{margin:0;padding:24px;font:16px/1.6 -apple-system,sans-serif;background:#10151E;color:#E7ECF3}@media (prefers-color-scheme:light){body{background:#F4F6F9;color:#18202E}}b{display:block;font-size:18px;margin-bottom:8px}</style></head>
<body><b>다봤니 · 리디 연결</b><p id="m">리디 화면에서 북마크를 누르면 여기로 연결됩니다.</p>
<script>
// 리디 화면은 외부 코드를 불러올 수 없어서(보안 정책), 짧은 북마크가 이 창을 열고 여기서 가져오기 코드를 받아 감
var OK = ['https://ridibooks.com', 'https://library.ridibooks.com'], code = null;
fetch('/ridi_bm.min.js?v=' + Date.now()).then(function (r) { return r.text(); }).then(function (s) { code = s; });
addEventListener('message', function (e) {
  if (OK.indexOf(e.origin) < 0 || !e.data || e.data.type !== 'dw-ridi-hello') return;
  var send = function () { if (!code) return setTimeout(send, 200); e.source.postMessage({ type: 'dw-ridi-code', code: code }, e.origin); document.getElementById('m').textContent = '연결됐습니다. 리디 화면으로 돌아가 「시작」을 눌러 주세요.'; };
  send();
});
</script></body></html>
