name: 압축 풀기 (처음 한 번)
on:
  push:
    paths: ['.github/workflows/unpack.yml']
  workflow_dispatch:
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOOT_TOKEN }}
      - name: 압축 풀고 커밋
        run: |
          unzip -o dabwanni.zip
          git rm -q dabwanni.zip .github/workflows/unpack.yml
          git config user.name "dabwanni-bot"
          git config user.email "dabwanni-bot@users.noreply.github.com"
          git add -A
          git commit -m "압축 풀기"
          git push
