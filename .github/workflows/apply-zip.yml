name: 수정본 적용 (update.zip)
on:
  push:
    paths: ['update.zip']
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOOT_TOKEN }}
      - name: 압축 풀고 커밋
        run: |
          unzip -o update.zip
          git rm -q update.zip
          git config user.name "dabwanni-bot"
          git config user.email "dabwanni-bot@users.noreply.github.com"
          git add -A
          git commit -m "수정본 적용"
          git push
